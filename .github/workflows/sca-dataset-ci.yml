name: build-and-test
on: [push, pull_request]
jobs:
  test:
    # Python 3.8: these 2014-era pins (Flask 0.10, Werkzeug 0.9) don't build on newer Pythons.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install
        # setuptools pin keeps pkg_resources, which the old Flask extensions import.
        run: python -m pip install "setuptools<76" -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
